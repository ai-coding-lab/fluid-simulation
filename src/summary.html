<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Simulation - Summary</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a1628, #1a3050, #0a2040);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            color: #fff;
            padding: 24px;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #60a5fa, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .diagram {
            opacity: 0;
            animation: fadeSlideIn 0.4s ease forwards;
            animation-delay: 1.0s;
            margin-bottom: 20px;
        }

        .diagram svg {
            max-width: 280px;
            width: 100%;
            height: auto;
        }

        .description {
            opacity: 0;
            animation: fadeSlideIn 0.4s ease forwards;
            animation-delay: 1.0s;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .prompt-section {
            opacity: 0;
            animation: fadeSlideIn 0.4s ease forwards;
            animation-delay: 2.0s;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px 24px;
            text-align: left;
        }

        .prompt-section h2 {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .prompt-section ul {
            list-style: none;
        }

        .prompt-section li {
            opacity: 0;
            animation: fadeSlideIn 0.4s ease forwards;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.85);
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .prompt-section li:last-child {
            border-bottom: none;
        }

        .prompt-section li:nth-child(1) { animation-delay: 3.0s; }
        .prompt-section li:nth-child(2) { animation-delay: 4.0s; }
        .prompt-section li:nth-child(3) { animation-delay: 5.0s; }

        .prompt-section li::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, #60a5fa, #3b82f6);
            border-radius: 50%;
            margin-top: 6px;
            flex-shrink: 0;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.6rem;
            }

            .description {
                font-size: 1rem;
            }

            .prompt-section li {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fluid Simulation</h1>

        <div class="diagram">
            <svg viewBox="0 0 280 120" xmlns="http://www.w3.org/2000/svg">
                <!-- Fluid grid background -->
                <defs>
                    <linearGradient id="fluidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#1e40af;stop-opacity:0.6" />
                        <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:0.8" />
                        <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:0.6" />
                    </linearGradient>
                    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#93c5fd" />
                    </marker>
                </defs>

                <!-- Grid cells representing velocity field -->
                <rect x="20" y="20" width="240" height="80" rx="8" fill="url(#fluidGrad)" stroke="#3b82f6" stroke-width="1"/>

                <!-- Velocity vectors showing flow -->
                <g stroke="#93c5fd" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)">
                    <path d="M 50,40 Q 70,35 90,45" />
                    <path d="M 80,60 Q 100,50 120,55" />
                    <path d="M 120,40 Q 145,30 170,40" />
                    <path d="M 150,65 Q 175,55 200,60" />
                    <path d="M 190,40 Q 210,35 230,45" />
                </g>

                <!-- Swirl/vortex indicator -->
                <circle cx="140" cy="55" r="12" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.7"/>

                <!-- Mouse cursor -->
                <g transform="translate(55, 55)">
                    <path d="M 0,0 L 0,16 L 4,12 L 8,20 L 11,18 L 7,11 L 12,10 Z" fill="#fff" stroke="#1e40af" stroke-width="0.5"/>
                </g>

                <!-- Label -->
                <text x="140" y="112" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-size="10" font-family="sans-serif">Navier-Stokes Velocity Field</text>
            </svg>
        </div>

        <p class="description">
            マウスでかき回せるインタラクティブな流体シミュレーション
        </p>

        <div class="prompt-section">
            <h2>プロンプト(要約)</h2>
            <ul>
                <li>Navier-Stokes方程式で流体の拡散・移流を再現</li>
                <li>マウス速度に応じて渦や乱流が自然発生</li>
                <li>カラーパレット切替・粘性調整スライダー付き</li>
            </ul>
        </div>
    </div>
</body>
</html>
